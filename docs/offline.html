<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オフライン | Deaf Navi Web</title>
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', 'Meiryo', system-ui, sans-serif;
      background: #f3f5f4;
      color: #17201d;
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      line-height: 1.8;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #131917; color: #e8eeec; }
      .panel { background: #1c2421 !important; border-color: #3a4741 !important; }
      a { color: #6cc2b5 !important; }
    }
    .panel {
      max-width: 480px;
      background: #ffffff;
      border: 1px solid #c7d0cc;
      border-radius: 12px;
      padding: 32px;
      text-align: center;
    }
    h1 { font-size: 1.3rem; margin: 0 0 12px; }
    p { margin: 0 0 12px; }
    a { color: #075e57; font-weight: 700; }
    .icon { font-size: 2.2rem; }
    ul { text-align: left; padding-left: 1.4em; margin: 12px 0; }
  </style>
</head>
<body>
  <div class="panel">
    <p class="icon" aria-hidden="true">📡</p>
    <h1>オフラインです</h1>
    <p>インターネットに接続できないため、このページを表示できません。</p>
    <ul>
      <li>一度表示したページは、オフラインでも開ける場合があります</li>
      <li><a href="./guide.html">暮らしのガイド</a>（緊急通報・公式情報）は保存済みなら閲覧できます</li>
    </ul>
    <p><a href="./">接続が戻ったらトップへ</a></p>
  </div>
</body>
</html>
