<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="おとまど — 音を、見える窓へ。ろう者・難聴者のための無料の情報保障ツール。音の見張り（AI音分類）・リアルタイム字幕・筆談ボードがブラウザだけで動きます。" />
    <meta name="theme-color" content="#0f766e" />
    <link rel="canonical" href="https://tamas-hub.github.io/deaf-navi-web/otomado/" />
    <meta property="og:title" content="おとまど — 音を、見える窓へ。" />
    <meta property="og:description" content="ろう者・難聴者のための無料の情報保障ツールボックス。音の見張り・リアルタイム字幕・筆談ボードがブラウザだけで動きます。おとセンサーの音声処理は端末内で完結します。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tamas-hub.github.io/deaf-navi-web/otomado/" />
    <meta property="og:image" content="https://tamas-hub.github.io/deaf-navi-web/otomado/icons/icon-512.png" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" />
    <title>おとまど — 音を、見える窓へ。</title>
    <script>
      // FOUC防止: 保存済みテーマを描画前に適用する
      (function () {
        try {
          var raw = localStorage.getItem('otomado:settings:v1');
          var theme = raw ? JSON.parse(raw).theme : 'aurora';
          document.documentElement.dataset.theme = ['aurora', 'dark', 'light', 'green'].indexOf(theme) >= 0 ? theme : 'aurora';
        } catch (e) {
          document.documentElement.dataset.theme = 'aurora';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-size: 1.25rem">
        おとまど を使うには JavaScript を有効にしてください。<br />
        Please enable JavaScript to use OtoMado.
      </p>
    </noscript>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
