[deafnavi]
user = deafnavi-runtime
group = caddy
listen = /run/php/deafnavi.sock
listen.owner = caddy
listen.group = caddy
listen.mode = 0660
pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 15s
pm.max_requests = 500
request_terminate_timeout = 30s
clear_env = yes
env[DEAFNAVI_DATA_DIR] = /srv/deafnavi/shared/directory
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /srv/deafnavi/shared/directory/php-error.log
php_admin_value[upload_max_filesize] = 1K
php_admin_value[post_max_size] = 64K
php_admin_flag[file_uploads] = off
php_admin_value[session.save_path] = /srv/deafnavi/shared/directory/sessions
php_admin_value[session.gc_probability] = 1
php_admin_value[session.gc_divisor] = 100
php_admin_value[session.gc_maxlifetime] = 7200
php_admin_value[open_basedir] = /srv/deafnavi:/usr/share/php:/etc/ssl/certs:/usr/share/zoneinfo
security.limit_extensions = .php
