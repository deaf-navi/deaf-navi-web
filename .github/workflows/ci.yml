# PR検証用ワークフロー。
# 本番のデータ更新・公開は curate.yml / curate-world.yml / app-sync.yml が担当し、
# ここではコミット済みデータを入力に「テスト・ビルド・検証」だけを行う（書き込み権限なし・ネットワーク不要）。
name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      php85_only:
        description: 'Run only the isolated PHP 8.5.12 compatibility suite'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.php85_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unit / integration / iOS-compat tests
        run: npm test

      - name: Install PHP SQLite runtime
        run: sudo apt-get update && sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-gd

      - name: Cafe schema, migration and directory regression
        run: |
          npm run test:stories
          npm run test:cafes
          node test/engagement.integration.mjs
          php test/cafe-event-recovery.php
          node test/cafe-event-recovery.integration.mjs

      - name: Install OtoMado dependencies
        run: npm ci --prefix tools/otomado

      - name: Test OtoMado
        run: npm run test:otomado

      - name: Build OtoMado
        run: npm run build:otomado

      - name: Build site from committed data
        run: npm run build

      - name: Build World portal from committed data
        run: npm run build:world

      - name: Build app API from committed data
        run: npm run build:app-api

      - name: Verify site output
        run: npm run verify

      - name: Verify World portal output
        run: npm run verify:world

  php85:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.php85_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout reviewed validation ref
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build PHP 8.5.12 and run offline existing tests
        shell: bash
        run: bash .github/php85/run-ci.sh

      - name: Retain version, source hash, build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php85-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/php85-evidence/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
