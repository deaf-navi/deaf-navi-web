name: Check Sign Cafe Event Sources

on:
  schedule:
    # JST 06:40. Content curation runs separately in the current Codex thread.
    - cron: '40 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deaf-navi-cafe-event-source-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - name: Configure existing deployment connection
        env:
          DEPLOY_KEY: ${{ secrets.DEAFNAVI_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEAFNAVI_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deafnavi_deploy
          chmod 600 ~/.ssh/deafnavi_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Check registered public sources once per Japan calendar day
        env:
          DEPLOY_HOST: ${{ vars.DEAFNAVI_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEAFNAVI_DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          ssh -i ~/.ssh/deafnavi_deploy -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            'php /srv/deafnavi/current/_backend/check-cafe-event-sources.php --apply'
