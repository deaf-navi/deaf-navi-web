name: Deploy XServer

on:
  workflow_run:
    workflows: ['Curate & Build', 'Curate & Build World', 'Recover Event Sources']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'server/**'
      - '.github/workflows/deploy-xserver.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deaf-navi-xserver-deploy
  cancel-in-progress: false

jobs:
  recovery-publication:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Recover Event Sources' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check whether recovery published a snapshot
        id: check
        env:
          RECOVERY_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node scripts/event-recovery-publication.mjs

  deploy:
    needs: recovery-publication
    if: always() && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && (github.event.workflow_run.name != 'Recover Event Sources' || needs.recovery-publication.outputs.publish == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static release
        run: |
          set -euo pipefail
          test -s docs/index.html
          test -s docs/404.html
          test -s docs/robots.txt
          test -s docs/sitemap.xml
          test -s docs/app/v1/manifest.json
          test -s docs/connect/sign-cafe/index.html
          test ! -e docs/connect/sign-cafe/starbucks/index.html
          test -s docs/cafe-map/map-2d.js
          test -s docs/cafe-map/leaflet/leaflet.js
          test -s docs/directory-community.css
          if find docs -type l -print -quit | grep -q .; then
            echo 'Symbolic links are not allowed in the deployment archive.' >&2
            exit 1
          fi
          grep -Fq 'https://deafnavi.com/' docs/index.html
          grep -Fq 'https://deafnavi.com/app/v1/' docs/app/v1/manifest.json
          if grep -RIEq 'Shippori|Mincho|Noto[ -]?Serif|font-serif|Hiragino Mincho|Yu Mincho|MS PMincho' docs \
            --include='*.html' --include='*.css' --include='*.svg'; then
            echo 'A prohibited serif/mincho font reference remains.' >&2
            exit 1
          fi

      - name: Install PHP image test runtime
        run: sudo apt-get update && sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-gd

      - name: Build release archive
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find server -name '*.php' -print0)
          php -r 'json_decode(file_get_contents("server/seed.json"),true,512,JSON_THROW_ON_ERROR);'
          node test/stories.integration.mjs
          node test/directory.integration.mjs
          node test/admin-dashboard.integration.mjs
          node test/admin-session.integration.mjs
          node test/access-logs.integration.mjs
          php test/access-analytics.test.php
          php test/access-quality.test.php
          node test/access-visitors.integration.mjs
          node test/engagement.integration.mjs
          node test/access-sw.test.mjs
          node --test test/directory-safety.test.mjs
          python3 test/access-maintenance.test.py
          node test/overseas-cafes.integration.mjs
          php test/world-cafes.php
          node test/cafe-seo.integration.mjs
          php test/cafe-event-recovery.php
          node test/cafe-event-recovery.integration.mjs
          node test/cafe-events.integration.mjs
          node test/cafe-event-curation.integration.mjs
          php test/public-profile.test.php
          node test/social-import.mjs
          tar -czf "$RUNNER_TEMP/deafnavi-site.tar.gz" --transform='s,^server,_backend,' -C docs . -C .. server

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEAFNAVI_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEAFNAVI_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deafnavi_deploy
          chmod 600 ~/.ssh/deafnavi_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release archive
        env:
          DEPLOY_HOST: ${{ vars.DEAFNAVI_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEAFNAVI_DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          archive="${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          scp -i ~/.ssh/deafnavi_deploy -o BatchMode=yes \
            "$RUNNER_TEMP/deafnavi-site.tar.gz" \
            "$DEPLOY_USER@$DEPLOY_HOST:/srv/deafnavi/incoming/$archive"

      - name: Activate release atomically
        env:
          DEPLOY_HOST: ${{ vars.DEAFNAVI_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEAFNAVI_DEPLOY_USER }}
        run: |
          set -euo pipefail
          archive="${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          release_id="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          source_commit="$(git rev-parse HEAD)"
          expected_backend_sha="$(git show "$source_commit:server/cafe-seo.php" | sha256sum | cut -d ' ' -f 1)"
          printf 'Release source commit: %s\n' "$source_commit"
          ssh -i ~/.ssh/deafnavi_deploy -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$archive" "$release_id" "$expected_backend_sha" <<'REMOTE'
          set -euo pipefail
          archive_name="$1"
          release_id="$2"
          expected_backend_sha="$3"
          [[ "$expected_backend_sha" =~ ^[0-9a-f]{64}$ ]] || { echo 'Invalid backend checksum.' >&2; exit 1; }
          root=/srv/deafnavi
          archive="$root/incoming/$archive_name"
          staging="$root/releases/.staging-$release_id"
          release="$root/releases/$release_id"

          case "$archive_name$release_id" in
            *[!A-Za-z0-9._-]*) echo 'Invalid release identifier.' >&2; exit 1 ;;
          esac

          verify_cafe_backend() {
            local release_path="$1"
            local actual_sha
            actual_sha="$(sha256sum "$release_path/_backend/cafe-seo.php" | cut -d ' ' -f 1)"
            printf 'Cafe backend SHA-256: %s %s\n' "$release_path" "$actual_sha"
            test "$actual_sha" = "$expected_backend_sha" || { echo 'Cafe backend checksum mismatch.' >&2; return 1; }
          }

          exec 9>"$root/shared/deploy.lock"
          flock -n 9 || { echo 'Another deployment is active.' >&2; exit 75; }
          previous_current="$(readlink -f "$root/current" || true)"
          printf 'Previous current target: %s\n' "$previous_current"
          if test -s "$root/current/_backend/cafe-seo.php"; then
            printf 'Previous cafe backend SHA-256: '
            sha256sum "$root/current/_backend/cafe-seo.php" | cut -d ' ' -f 1
          fi
          test -f "$archive"
          test ! -e "$staging"
          test ! -e "$release"
          mkdir "$staging"
          tar -xzf "$archive" -C "$staging"
          rm -f "$archive"

          test -s "$staging/index.html"
          test -s "$staging/404.html"
          test -s "$staging/robots.txt"
          test -s "$staging/sitemap.xml"
          test -s "$staging/app/v1/manifest.json"
          test -s "$staging/connect/sign-cafe/index.html"
          test ! -e "$staging/connect/sign-cafe/starbucks/index.html"
          test -s "$staging/_backend/index.php"
          test -s "$staging/directory.css"
          test -s "$staging/directory-ui.js"
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find "$staging/_backend" -name '*.php' -print0)
          test -S /run/php/deafnavi.sock
          if find "$staging" -type l -print -quit | grep -q .; then
            echo 'Release contains a symbolic link.' >&2
            exit 1
          fi
          grep -Fq 'https://deafnavi.com/' "$staging/index.html"
          grep -Fq 'https://deafnavi.com/app/v1/' "$staging/app/v1/manifest.json"
          if grep -RIEq 'Shippori|Mincho|Noto[ -]?Serif|font-serif|Hiragino Mincho|Yu Mincho|MS PMincho' "$staging" \
            --include='*.html' --include='*.css' --include='*.svg'; then
            echo 'A prohibited serif/mincho font reference remains.' >&2
            exit 1
          fi

          verify_cafe_backend "$staging"
          chgrp -R caddy "$staging"
          find "$staging" -type d -exec chmod 750 {} +
          find "$staging" -type f -exec chmod 640 {} +
          mv "$staging" "$release"
          ln -s "$release" "$root/.current-$release_id"
          mv -Tf "$root/.current-$release_id" "$root/current"
          current_target="$(readlink -f "$root/current")"
          printf 'Activated current target: %s\n' "$current_target"
          test "$current_target" = "$release" || { echo 'Current target mismatch.' >&2; exit 1; }
          verify_cafe_backend "$root/current"
          printf '%s\n' "$release_id" > "$root/shared/last-release"
          REMOTE

      - name: Verify public release
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 --user-agent 'Codex-DeafNavi-Verification' https://deafnavi.com/ > /dev/null
          curl --fail --silent --show-error --max-time 20 --user-agent 'Codex-DeafNavi-Verification' https://deafnavi.com/app/v1/manifest.json > /dev/null

          cafe_url='https://deafnavi.com/connect/sign-cafe/?dn_client=codex'
          curl --fail --silent --show-error --location --max-time 20 \
            --user-agent 'Codex-DeafNavi-Verification' \
            --dump-header "$RUNNER_TEMP/cafe-public.headers" \
            --output "$RUNNER_TEMP/cafe-public.html" "$cafe_url"
          awk 'tolower($0) ~ /^(http\/|cache-control:|age:|server:|via:|x-cache:|content-type:|last-modified:|etag:)/' "$RUNNER_TEMP/cafe-public.headers"
          if grep -Fq '<a href="#cafes">手話カフェの一覧へ戻る</a>' "$RUNNER_TEMP/cafe-public.html"; then
            echo 'Cafe FAQ return link: present in public HTML.'
          else
            echo '::warning::Cafe FAQ return link is absent from public HTML; publication QA remains incomplete.'
          fi
