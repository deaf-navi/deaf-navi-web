name: Recover Event Sources

on:
  schedule:
    # JST 08:40 / 14:40 / 20:40. Normal publication also checks sources 3x/day.
    - cron: '40 5,11,23 * * *'
  workflow_dispatch:
    inputs:
      recheck:
        description: Recheck all registered HTML sources instead of only due failures
        type: boolean
        default: false

permissions:
  contents: write

# Serialize event state writes with the normal domestic publisher.
concurrency:
  group: deaf-navi-domestic-publisher
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Retry due event sources
        id: recovery
        env:
          EVENT_RECOVERY_FORCE: ${{ github.event.inputs.recheck || 'false' }}
        run: npm run events:recover
      - name: Build and verify
        if: steps.recovery.outputs.updated == 'true'
        run: |
          npm run build
          npm run verify
      - name: Publish recovered state
        if: steps.recovery.outputs.updated == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .state/events.json .state/thumbnails-events.json docs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(events): recover ${GITHUB_RUN_ID}"
          # No force push: a concurrent main change safely retries at the next scheduled run.
          git push origin HEAD:main
