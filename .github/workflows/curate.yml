name: Curate & Build

on:
  schedule:
    # JST 06:00 / 12:00 / 18:00
    - cron: '0 3,9,21 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/**'

permissions:
  contents: write
  issues: write

concurrency:
  group: deaf-navi-publisher
  cancel-in-progress: false

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CODEX_APP_SERVER_URL: ${{ secrets.CODEX_APP_SERVER_URL }}
      CODEX_APP_SERVER_TOKEN: ${{ secrets.CODEX_APP_SERVER_TOKEN }}
      CODEX_APP_SERVER_TIMEOUT_SECONDS: ${{ vars.CODEX_APP_SERVER_TIMEOUT_SECONDS || '120' }}
      CODEX_APP_SERVER_READINESS_PATH: ${{ vars.CODEX_APP_SERVER_READINESS_PATH || '/ready' }}
      WORLD_JP_CODEX_BATCH_SIZE: ${{ vars.WORLD_JP_CODEX_BATCH_SIZE || '20' }}
      WORLD_JP_CODEX_MAX_ITEMS: ${{ vars.WORLD_JP_CODEX_MAX_ITEMS || '600' }}
      WORLD_JP_CODEX_RETRIES: ${{ vars.WORLD_JP_CODEX_RETRIES || '1' }}
      WORLD_JP_CODEX_SPLIT_BATCH_SIZE: ${{ vars.WORLD_JP_CODEX_SPLIT_BATCH_SIZE || '10' }}
      WORLD_JP_CODEX_MAX_CONSECUTIVE_FAILED_BATCHES: ${{ vars.WORLD_JP_CODEX_MAX_CONSECUTIVE_FAILED_BATCHES || '2' }}
      WORLD_JP_CODEX_MIN_COVERAGE: ${{ vars.WORLD_JP_CODEX_MIN_COVERAGE || '0.85' }}
      WORLD_JP_CODEX_FAIL_ON_LOW_COVERAGE: ${{ vars.WORLD_JP_CODEX_FAIL_ON_LOW_COVERAGE || '0' }}
      WORLD_JP_REQUIRE_CODEX_POST_EDIT: '1'
      WORLD_REGION_MIN_ARTICLES: ${{ vars.WORLD_REGION_MIN_ARTICLES || '50' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate all static artifacts
        run: |
          npm run generate
          npm run generate:world
          npm run build:app-api

      - name: Commit & push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(publish): update all feeds $(date -u +'%Y-%m-%dT%H:%MZ')"
          # リモートが進んでいた場合に備えてリトライ付きpush
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push failed (attempt $attempt). Rebasing onto latest main..."
            git pull --rebase origin main || true
          done
          echo "Push failed after 3 attempts."
          exit 1

  notify-on-failure:
    needs: curate
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Curation workflow needs attention';
            const body = `キュレーションActionsが失敗しました。ログを確認してください。\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
