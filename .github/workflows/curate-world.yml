name: Curate & Build World

on:
  schedule:
    # JST 06:00 / 12:00 / 18:00
    - cron: '0 3,9,21 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - '.github/workflows/curate-world.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: curate-world
  cancel-in-progress: false

jobs:
  curate-world:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Curate and build Deaf Navi World
        env:
          CODEX_APP_SERVER_URL: ${{ secrets.CODEX_APP_SERVER_URL }}
          CODEX_APP_SERVER_TOKEN: ${{ secrets.CODEX_APP_SERVER_TOKEN }}
          CODEX_APP_SERVER_TIMEOUT_SECONDS: ${{ vars.CODEX_APP_SERVER_TIMEOUT_SECONDS || '120' }}
          WORLD_JP_CODEX_BATCH_SIZE: ${{ vars.WORLD_JP_CODEX_BATCH_SIZE || '20' }}
          WORLD_JP_CODEX_MAX_ITEMS: ${{ vars.WORLD_JP_CODEX_MAX_ITEMS || '600' }}
          WORLD_JP_CODEX_RETRIES: ${{ vars.WORLD_JP_CODEX_RETRIES || '1' }}
          WORLD_JP_CODEX_MIN_COVERAGE: ${{ vars.WORLD_JP_CODEX_MIN_COVERAGE || '0.85' }}
          WORLD_JP_REQUIRE_CODEX_POST_EDIT: '1'
          WORLD_REGION_MIN_ARTICLES: ${{ vars.WORLD_REGION_MIN_ARTICLES || '50' }}
        run: npm run generate:world

      - name: Commit & push world artifacts
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/articles-world.json docs/deaf-navi-world-jp.html docs/deaf-navi-world-original.html docs/deaf-navi-world-en.html docs/deaf-navi-world.html docs/styles-world.css docs/app-world.js docs/feed-world.xml docs/feed-world-original.xml docs/feed-world-en.xml docs/sitemap-world.xml docs/og-image-world.svg
          if git diff --cached --quiet; then
            echo "No world changes to commit."
            exit 0
          fi
          git commit -m "chore(curate-world): update world articles $(date -u +'%Y-%m-%dT%H:%MZ')"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push failed (attempt $attempt). Rebasing onto latest main..."
            git pull --rebase origin main || true
          done
          echo "Push failed after 3 attempts."
          exit 1

  notify-on-failure:
    needs: curate-world
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Create or update failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const label = 'curation-failure';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const title = 'Deaf Navi World curation requires attention';
            const body = [
              'Deaf Navi World のキュレーション Actions が失敗しました。',
              '',
              `Run: ${runUrl}`,
              `Time: ${new Date().toISOString()}`,
              '',
              '想定される主な原因:',
              '- VPS上の `deaf-navi-codex-app-server` が落ちている',
              '- `CODEX_APP_SERVER_URL` / `CODEX_APP_SERVER_TOKEN` のGitHub Secretsが不一致',
              '- Codex後処理の成功率が必要なしきい値を下回った',
              '- Google News / 翻訳 / 外部通信の一時的な失敗',
              '',
              '初動確認:',
              '- GitHub Actionsの該当Runログで `codex-postedit` とエラー箇所を確認',
              '- VPSで `pm2 describe deaf-navi-codex-app-server` を確認',
              '- VPSで `systemctl status deaf-navi-codex-healthcheck.timer` を確認',
              '- トークン値はIssueやログに貼らない',
              '',
              'このIssueは重複作成を避けるため、未解決の同種Issueがあればコメント追記されます。復旧確認後にcloseしてください。',
            ].join('\n');

            try {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: label,
                color: 'd73a4a',
                description: 'Automated curation workflow failure',
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

            const existing = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: label,
              per_page: 20,
            });
            const issue = existing.data.find((item) => item.title === title);
            if (issue) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: [label],
              });
            }
