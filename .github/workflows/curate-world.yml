name: Curate & Build World

on:
  schedule:
    # JST 06:00 / 12:00 / 18:00
    - cron: '0 3,9,21 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - '.github/workflows/curate-world.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: curate-world
  cancel-in-progress: false

jobs:
  curate-world:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Curate and build Deaf Navi World
        env:
          CODEX_APP_SERVER_URL: ${{ secrets.CODEX_APP_SERVER_URL }}
          CODEX_APP_SERVER_TOKEN: ${{ secrets.CODEX_APP_SERVER_TOKEN }}
          CODEX_APP_SERVER_TIMEOUT_SECONDS: ${{ vars.CODEX_APP_SERVER_TIMEOUT_SECONDS || '120' }}
          WORLD_JP_CODEX_BATCH_SIZE: ${{ vars.WORLD_JP_CODEX_BATCH_SIZE || '20' }}
          WORLD_JP_CODEX_MAX_ITEMS: ${{ vars.WORLD_JP_CODEX_MAX_ITEMS || '600' }}
        run: npm run generate:world

      - name: Commit & push world artifacts
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/articles-world.json docs/deaf-navi-world-jp.html docs/deaf-navi-world-original.html docs/deaf-navi-world-en.html docs/deaf-navi-world.html docs/styles-world.css docs/app-world.js docs/feed-world.xml docs/feed-world-original.xml docs/feed-world-en.xml docs/sitemap-world.xml docs/og-image-world.svg
          if git diff --cached --quiet; then
            echo "No world changes to commit."
            exit 0
          fi
          git commit -m "chore(curate-world): update world articles $(date -u +'%Y-%m-%dT%H:%MZ')"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push failed (attempt $attempt). Rebasing onto latest main..."
            git pull --rebase origin main || true
          done
          echo "Push failed after 3 attempts."
          exit 1

  notify-on-failure:
    needs: curate-world
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = `World curation failed: ${new Date().toISOString()}`;
            const body = `Deaf Navi World のキュレーション Actions が失敗しました。\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['curation-failure']
            });
