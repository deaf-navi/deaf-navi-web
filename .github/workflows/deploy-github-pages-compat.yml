name: Deploy GitHub Pages compatibility site

on:
  workflow_run:
    workflows: ['Curate & Build', 'Curate & Build World', 'Recover Event Sources']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'config/site.mjs'
      - 'scripts/build-github-pages-compat.mjs'
      - 'test/github-pages-compat.test.mjs'
      - '.github/workflows/deploy-github-pages-compat.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deaf-navi-github-pages
  # A no-op recovery run must not cancel a real deployment before its gate runs.
  cancel-in-progress: false

jobs:
  recovery-publication:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Recover Event Sources' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check whether recovery published a snapshot
        id: check
        env:
          RECOVERY_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node scripts/event-recovery-publication.mjs

  build:
    needs: recovery-publication
    if: always() && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && (github.event.workflow_run.name != 'Recover Event Sources' || needs.recovery-publication.outputs.publish == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build redirect and API compatibility artifact
        run: node scripts/build-github-pages-compat.mjs "$RUNNER_TEMP/site"

      - name: Verify redirect and API compatibility
        run: node --test test/github-pages-compat.test.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
