name: Deploy GitHub Pages compatibility site

on:
  workflow_run:
    workflows: ['Curate & Build']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'config/site.mjs'
      - 'scripts/build-github-pages-compat.mjs'
      - 'test/github-pages-compat.test.mjs'
      - '.github/workflows/deploy-github-pages-compat.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deaf-navi-github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build redirect and API compatibility artifact
        run: node scripts/build-github-pages-compat.mjs "$RUNNER_TEMP/site"

      - name: Verify redirect and API compatibility
        run: node --test test/github-pages-compat.test.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
