name: Event source transport diagnosis
on: pull_request
permissions:
  contents: read
jobs:
  diagnose:
    if: github.head_ref == 'fix/event-source-transport'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/diagnose-event-sources.mjs
