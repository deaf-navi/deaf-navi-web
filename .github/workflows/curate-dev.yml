name: Curate & Build Dev

on:
  schedule:
    # JST 06:00 / 12:00 / 18:00
    - cron: '0 3,9,21 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - '.github/workflows/curate-dev.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: curate-dev
  cancel-in-progress: false

jobs:
  curate-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Curate dev data and build dev pages
        run: npm run generate:dev

      - name: Commit & push dev artifacts
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/articles-dev.json docs/articles-old-dev.json docs/index-dev.html docs/index-old-dev.html docs/about-dev.html docs/styles-dev.css docs/app-dev.js docs/sitemap-dev.xml docs/robots-dev.txt docs/feed-dev.xml docs/og-image-dev.svg
          if git diff --cached --quiet; then
            echo "No dev changes to commit."
            exit 0
          fi
          git commit -m "chore(curate-dev): update dev articles $(date -u +'%Y-%m-%dT%H:%MZ')"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push failed (attempt $attempt). Rebasing onto latest main..."
            git pull --rebase origin main || true
          done
          echo "Push failed after 3 attempts."
          exit 1

  notify-on-failure:
    needs: curate-dev
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Dev curation failed: ${new Date().toISOString()}`;
            const body = `dev版キュレーションActionsが失敗しました。ログを確認してください。\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['curation-failure']
            });
